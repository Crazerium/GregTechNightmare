// Add any additional repositories for your dependencies here.

repositories {
    exclusiveContent {
        forRepositories(
            maven {
                name = "ChromaticTooltips"
                url = "https://slprime.github.io/ChromaticTooltips/"
            },
            maven {
                name = "ChromaticTooltipsCompat"
                url = "https://slprime.github.io/ChromaticTooltipsCompat/"
            }
        )
        filter {
            includeGroup("com.github.slprime")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "LocalThaumcraft"
                url = rootDir.toPath().resolve(".local-maven").toUri()
            }
        }
        filter {
            includeGroup("thaumcraft")
        }
    }
}
